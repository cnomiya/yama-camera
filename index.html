<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1014">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>山座同定カメラ</title>
<style>/* カメラ画面が主役なので、暗い単一テーマで統一する。
   レイアウト: 全面ステージ(カメラ/写真)+上の状態表示+下の操作帯+下から出る根拠シート */
:root {
  --ink: #0d1014;          /* 背景(夜明け前の山影) */
  --ink-2: #161b21;        /* シート面 */
  --ink-3: #222a33;        /* 区切り・入力欄 */
  --snow: #eef2f4;         /* 文字(雪面の白) */
  --mist: #9aa7b2;         /* 補足文字 */
  --alpen: #f0a35e;        /* アクセント(アーベントロートの橙) */
  --ok: #7fd1a5;           /* 見える */
  --warn: #e9c46a;         /* ぎりぎり */
  --bad: #ef8a80;          /* 隠れる */
  --font-ui: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", sans-serif;
  --font-num: ui-monospace, "SF Mono", "Menlo", "Consolas", monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--ink); color: var(--snow); font-family: var(--font-ui); -webkit-text-size-adjust: 100%; }
body { overflow: hidden; overscroll-behavior: none; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--alpen); outline-offset: 2px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

/* ---- ホーム ---- */
#home { position: fixed; inset: 0; display: grid; place-items: center; padding: max(24px, env(safe-area-inset-top)) 20px max(24px, env(safe-area-inset-bottom)); overflow-y: auto;
  background: radial-gradient(120% 70% at 50% 100%, #2a2018 0%, transparent 60%), var(--ink); }
.home-inner { width: 100%; max-width: 420px; display: grid; gap: 28px; }
.ridge-mark { width: 100%; height: 72px; display: block; }
.home-title { margin: 0; font-size: 30px; letter-spacing: .04em; font-weight: 700; text-wrap: balance; }
.home-lead { margin: 6px 0 0; color: var(--mist); line-height: 1.7; font-size: 15px; }
.home-actions { display: grid; gap: 12px; }
.btn-big { display: grid; grid-template-columns: 44px 1fr; align-items: center; gap: 14px; text-align: left; padding: 16px 18px; border-radius: 14px; border: 1px solid var(--ink-3); background: var(--ink-2); }
.btn-big strong { display: block; font-size: 17px; }
.btn-big span { display: block; color: var(--mist); font-size: 13px; margin-top: 2px; }
.btn-big.primary { background: var(--alpen); color: #1a120b; border-color: transparent; }
.btn-big.primary span { color: #4a3220; }
.btn-big svg { width: 32px; height: 32px; }
.home-foot { color: var(--mist); font-size: 12px; line-height: 1.7; display: flex; flex-wrap: wrap; gap: 4px 14px; justify-content: space-between; }
.linklike { background: none; border: 0; padding: 0; color: var(--snow); text-decoration: underline; text-underline-offset: 3px; }
.banner { padding: 12px 14px; border-radius: 10px; background: #3a2220; color: #ffd9d4; font-size: 13px; line-height: 1.6; }

/* ---- ステージ ---- */
#stage { position: fixed; inset: 0; background: #000; touch-action: none; user-select: none; -webkit-user-select: none; }
#video, #still { position: absolute; inset: 0; width: 100%; height: 100%; }
#video { object-fit: cover; }
#overlay { position: absolute; inset: 0; width: 100%; height: 100%; }

.topbar { position: absolute; left: 0; right: 0; top: 0; padding: calc(env(safe-area-inset-top, 0px) + 8px) 10px 8px; display: flex; flex-wrap: wrap; gap: 6px; pointer-events: none;
  background: linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,0)); }
.chip { pointer-events: auto; display: inline-flex; align-items: baseline; gap: 6px; padding: 5px 9px; border-radius: 999px; background: rgba(13,16,20,.72); border: 1px solid rgba(255,255,255,.08); font-size: 12px; line-height: 1.2; white-space: nowrap; }
.chip b { font-weight: 600; color: var(--mist); }
.chip.warn { border-color: rgba(233,196,106,.6); }
.chip.good { border-color: rgba(127,209,165,.55); }
.toast { position: absolute; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 84px); max-width: min(92vw, 520px); padding: 10px 14px; border-radius: 10px; background: rgba(13,16,20,.9); border: 1px solid var(--ink-3); font-size: 13px; line-height: 1.6; text-align: center; pointer-events: none; }

.bottombar { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 14px calc(env(safe-area-inset-bottom, 0px) + 14px); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px;
  background: linear-gradient(rgba(0,0,0,0), rgba(0,0,0,.6)); }
.bottombar .left { justify-self: start; display: flex; gap: 8px; }
.bottombar .right { justify-self: end; display: flex; gap: 8px; }
.icon-btn { min-width: 44px; height: 44px; padding: 0 12px; border-radius: 22px; border: 1px solid rgba(255,255,255,.14); background: rgba(13,16,20,.72); font-size: 13px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.icon-btn svg { width: 20px; height: 20px; }
.shutter { width: 74px; height: 74px; border-radius: 50%; border: 4px solid var(--snow); background: rgba(240,163,94,.9); box-shadow: 0 0 0 3px rgba(0,0,0,.35); }
.shutter:active { transform: scale(.96); }
.hint { grid-column: 1 / -1; text-align: center; font-size: 12px; color: var(--mist); }

/* ---- シート ---- */
.sheet { position: fixed; left: 0; right: 0; bottom: 0; max-height: 52vh; overflow-y: auto; -webkit-overflow-scrolling: touch; background: var(--ink-2); border-radius: 18px 18px 0 0; border-top: 1px solid var(--ink-3);
  padding: 8px 16px calc(env(safe-area-inset-bottom, 0px) + 20px); box-shadow: 0 -12px 40px rgba(0,0,0,.5); z-index: 10; overscroll-behavior: contain; }
@media (min-width: 760px) { .sheet { left: auto; right: 16px; bottom: 16px; width: 440px; max-height: calc(100vh - 32px); border-radius: 18px; border: 1px solid var(--ink-3); } }
.sheet-grip { display: flex; justify-content: space-between; align-items: center; position: sticky; top: -8px; background: var(--ink-2); padding: 8px 0; z-index: 1; }
.sheet-grip .bar { width: 40px; height: 4px; border-radius: 2px; background: var(--ink-3); }
.sheet h2 { margin: 4px 0 2px; font-size: 26px; letter-spacing: .02em; text-wrap: balance; }
.sheet h3 { margin: 22px 0 8px; font-size: 13px; letter-spacing: .08em; color: var(--mist); font-weight: 600; }
.sheet p { margin: 6px 0; line-height: 1.7; font-size: 14px; }
.sub { color: var(--mist); font-size: 14px; }
.level { display: inline-block; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; margin-right: 6px; vertical-align: 2px; }
.level.high { background: rgba(127,209,165,.18); color: var(--ok); }
.level.mid { background: rgba(233,196,106,.18); color: var(--warn); }
.level.low, .level.none { background: rgba(239,138,128,.16); color: var(--bad); }
.reasons { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.reasons li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; font-size: 14px; line-height: 1.65; }
.reasons .mk { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; margin-top: 1px; }
.mk.ok { background: rgba(127,209,165,.18); color: var(--ok); }
.mk.warn { background: rgba(233,196,106,.18); color: var(--warn); }
.mk.bad { background: rgba(239,138,128,.18); color: var(--bad); }
.reasons small { display: block; color: var(--mist); font-size: 12px; }
.cands { width: 100%; border-collapse: collapse; font-size: 13px; }
.cands-wrap { overflow-x: auto; }
.cands th { text-align: left; color: var(--mist); font-weight: 500; font-size: 11px; padding: 4px 6px; border-bottom: 1px solid var(--ink-3); white-space: nowrap; }
.cands td { padding: 8px 6px; border-bottom: 1px solid var(--ink-3); vertical-align: top; }
.cands tr.sel td { background: rgba(240,163,94,.08); }
.cands button { background: none; border: 0; padding: 0; text-align: left; color: var(--snow); text-decoration: underline; text-underline-offset: 3px; }
.st { font-size: 11px; padding: 1px 6px; border-radius: 6px; white-space: nowrap; }
.st.visible { color: var(--ok); background: rgba(127,209,165,.12); }
.st.marginal { color: var(--warn); background: rgba(233,196,106,.12); }
.st.hidden { color: var(--bad); background: rgba(239,138,128,.12); }
canvas.profile { width: 100%; height: 170px; display: block; background: var(--ink); border-radius: 10px; }
#map { width: 100%; height: 220px; border-radius: 10px; overflow: hidden; background: var(--ink-3); }
#map.map-lg { height: 300px; }
.where { font-size: 14px; line-height: 1.7; margin: 0 0 8px; }
.where strong { color: var(--alpen); font-weight: 700; }
.north { background: rgba(255,255,255,.92); color: #222; border-radius: 6px; padding: 2px 7px 3px; font: 700 11px/1.1 var(--font-ui); text-align: center; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.north span { display: block; font-size: 12px; }
.leaflet-tooltip.tip-peak { font: 700 12px/1.4 var(--font-ui); color: #1a120b; }
.leaflet-tooltip.tip-me { font: 600 11px/1.3 var(--font-ui); color: #0b2a5a; }
.tip-sub { font-weight: 500; color: #555; margin-left: 4px; }
.cond { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 12px; color: var(--mist); }
.cond dt { color: var(--mist); } .cond dd { margin: 0; color: var(--snow); min-width: 0; overflow-wrap: anywhere; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { padding: 10px 14px; border-radius: 10px; border: 1px solid var(--ink-3); background: var(--ink-3); font-size: 14px; }
.btn.primary { background: var(--alpen); color: #1a120b; border-color: transparent; font-weight: 600; }
.field { display: grid; gap: 6px; margin: 12px 0; font-size: 14px; }
.field input[type=text], .field input[type=number], .field select { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--ink-3); background: var(--ink); }
.field small { color: var(--mist); font-size: 12px; line-height: 1.6; }
.credit { margin-top: 18px; font-size: 11px; color: var(--mist); line-height: 1.7; }
.credit a, .sheet a { color: var(--snow); }
.busy { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(0,0,0,.35); z-index: 20; font-size: 14px; }
.busy div { padding: 14px 18px; border-radius: 12px; background: var(--ink-2); border: 1px solid var(--ink-3); }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: rise .22s ease-out; } @keyframes rise { from { transform: translateY(24px); opacity: .6; } to { transform: none; opacity: 1; } } }
.leaflet-container { background: var(--ink-3); font-family: var(--font-ui); }
</style>
</head>
<body>

<section id="home">
  <div class="home-inner">
    <div>
      <svg class="ridge-mark" viewBox="0 0 400 72" aria-hidden="true">
        <path d="M0 64 L38 40 L62 50 L104 18 L132 36 L158 28 L196 6 L232 34 L262 26 L300 44 L336 30 L372 48 L400 40 L400 72 L0 72 Z" fill="#1d242c"/>
        <path d="M0 64 L38 40 L62 50 L104 18 L132 36 L158 28 L196 6 L232 34 L262 26 L300 44 L336 30 L372 48 L400 40" fill="none" stroke="#eef2f4" stroke-width="2"/>
        <line x1="196" y1="6" x2="196" y2="0" stroke="#f0a35e" stroke-width="2"/>
        <circle cx="196" cy="6" r="3.5" fill="#f0a35e"/>
      </svg>
      <h1 class="home-title">山座同定カメラ</h1>
      <p class="home-lead">見えている山にカメラを向けるか、撮った写真を選ぶと、山の名前と「なぜその山と言えるか」を表示します。</p>
    </div>
    <div id="secureBanner" class="banner" hidden>このページはHTTPSで開かれていないため、カメラ・位置情報・方位センサーを使えません。HTTPSのURLで開いてください。写真からの判定は使えます。</div>
    <div class="home-actions">
      <button id="btnLive" class="btn-big primary" type="button">
        <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 11h5l2.5-3.5h9L23 11h5v15H4z"/><circle cx="16" cy="18" r="5"/></svg>
        <div><strong>カメラで調べる</strong><span>山に向けて、シャッターかタップ</span></div>
      </button>
      <button id="btnPhoto" class="btn-big" type="button">
        <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="6" width="24" height="20" rx="2"/><path d="M4 22l7-7 6 6 4-4 7 7"/><circle cx="22" cy="12" r="2"/></svg>
        <div><strong>写真から調べる</strong><span>位置情報付きの写真ならそのまま判定</span></div>
      </button>
    </div>
    <div class="home-foot">
      <button id="btnSettingsHome" class="linklike" type="button">設定</button>
      <span>標高: 国土地理院 / 山名: © OpenStreetMap contributors</span>
    </div>
  </div>
</section>

<section id="stage" hidden>
  <video id="video" playsinline muted autoplay></video>
  <canvas id="still" hidden></canvas>
  <canvas id="overlay"></canvas>
  <div class="topbar" id="chips"></div>
  <div class="toast" id="toast" hidden></div>
  <div class="bottombar">
    <div class="left">
      <button id="btnBack" class="icon-btn" type="button" aria-label="戻る">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <button id="btnPhoto2" class="icon-btn" type="button">写真</button>
      <button id="btnMap" class="icon-btn" type="button">地図</button>
    </div>
    <button id="btnShutter" class="shutter" type="button" aria-label="この景色で調べる"></button>
    <div class="right">
      <button id="btnAlign" class="icon-btn" type="button">自動合わせ</button>
      <button id="btnReset" class="icon-btn" type="button" aria-label="合わせを元に戻す">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 4v5h5"/></svg>
      </button>
      <button id="btnSettings" class="icon-btn" type="button" aria-label="設定">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>
      </button>
    </div>
    <div class="hint" id="hint"></div>
  </div>
</section>

<aside id="sheet" class="sheet" hidden aria-live="polite"></aside>
<div id="busy" class="busy" hidden><div id="busyText">計算中</div></div>
<input id="fileInput" type="file" accept="image/jpeg,image/*" hidden>

<script>/* 山座同定カメラ — 判定ロジック(DOM非依存。ブラウザとNodeの両方で動く) */
(function (root) {
'use strict';

const R_EARTH = 6371008.8;      // 地球の平均半径 [m]
const REFRACTION_K = 0.13;      // 大気差(光の屈折)係数。測量で一般的に用いられる値
const D2R = Math.PI / 180, R2D = 180 / Math.PI;

const normAz = a => { a %= 360; return a < 0 ? a + 360 : a; };
const angDiff = (a, b) => ((a - b) % 360 + 540) % 360 - 180;   // a-b を -180..180 に

/* ---------- 測地計算(球面) ---------- */
function distBearing(lat1, lon1, lat2, lon2) {
  const p1 = lat1 * D2R, p2 = lat2 * D2R, dl = (lon2 - lon1) * D2R;
  const a = Math.sin((p2 - p1) / 2) ** 2 + Math.cos(p1) * Math.cos(p2) * Math.sin(dl / 2) ** 2;
  const d = 2 * R_EARTH * Math.asin(Math.min(1, Math.sqrt(a)));
  const y = Math.sin(dl) * Math.cos(p2);
  const x = Math.cos(p1) * Math.sin(p2) - Math.sin(p1) * Math.cos(p2) * Math.cos(dl);
  return { d, az: normAz(Math.atan2(y, x) * R2D) };
}
function destination(lat, lon, azDeg, d) {
  const p1 = lat * D2R, l1 = lon * D2R, th = azDeg * D2R, dr = d / R_EARTH;
  const sp2 = Math.sin(p1) * Math.cos(dr) + Math.cos(p1) * Math.sin(dr) * Math.cos(th);
  const p2 = Math.asin(sp2);
  const l2 = l1 + Math.atan2(Math.sin(th) * Math.sin(dr) * Math.cos(p1), Math.cos(dr) - Math.sin(p1) * sp2);
  return { lat: p2 * R2D, lon: ((l2 * R2D + 540) % 360) - 180 };
}
/* 地球の丸みと大気差を考慮した見かけの仰角 [rad] */
function curvatureDrop(d) { return d * d * (1 - REFRACTION_K) / (2 * R_EARTH); }
function apparentElev(dh, d) { return Math.atan2(dh - curvatureDrop(d), Math.max(d, 1e-6)); }

/* ---------- Webメルカトルのタイル座標 ---------- */
const lonToPx = (lon, z) => (lon + 180) / 360 * 256 * 2 ** z;
const latToPx = (lat, z) => { const s = Math.sin(lat * D2R); return (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * 256 * 2 ** z; };

function tilesForRadius(lat, lon, radius, z) {
  const dN = destination(lat, lon, 0, radius), dS = destination(lat, lon, 180, radius);
  const dE = destination(lat, lon, 90, radius), dW = destination(lat, lon, 270, radius);
  const x0 = Math.floor(lonToPx(dW.lon, z) / 256), x1 = Math.floor(lonToPx(dE.lon, z) / 256);
  const y0 = Math.floor(latToPx(dN.lat, z) / 256), y1 = Math.floor(latToPx(dS.lat, z) / 256);
  const cx = lonToPx(lon, z), cy = latToPx(lat, z);
  const rpx = (lonToPx(dE.lon, z) - lonToPx(dW.lon, z)) / 2;
  const out = [];
  for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) {
    // 円と交わるタイルだけ
    const nx = Math.max(x * 256, Math.min(cx, x * 256 + 256)), ny = Math.max(y * 256, Math.min(cy, y * 256 + 256));
    if (Math.hypot(nx - cx, ny - cy) <= rpx * 1.02) out.push({ z, x, y });
  }
  return out;
}

/* 標高PNGのデコード */
function decodeGSI(rgba) {        // 国土地理院 標高タイル(PNG)の仕様
  const n = rgba.length / 4, out = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const r = rgba[i * 4], g = rgba[i * 4 + 1], b = rgba[i * 4 + 2];
    const x = r * 65536 + g * 256 + b;
    out[i] = x === 8388608 ? 0 : (x < 8388608 ? x * 0.01 : (x - 16777216) * 0.01);   // 無効値(海など)は0m
  }
  return out;
}
function decodeTerrarium(rgba) {  // Mapzen Terrarium形式
  const n = rgba.length / 4, out = new Float32Array(n);
  for (let i = 0; i < n; i++) out[i] = Math.max(0, rgba[i * 4] * 256 + rgba[i * 4 + 1] + rgba[i * 4 + 2] / 256 - 32768);
  return out;
}

/* ---------- 標高モデル(距離に応じて解像度を切り替える) ---------- */
const SEA = new Float32Array(65536);
class DEM {
  constructor(tiers) {             // tiers: [{z, maxDist}] 近い順
    this.tiers = tiers.slice().sort((a, b) => a.maxDist - b.maxDist);
    this.tiles = new Map();
    this._k = -1; this._a = null;
  }
  key(z, x, y) { return z * 1e10 + x * 1e5 + y; }
  setTile(z, x, y, arr) { this.tiles.set(this.key(z, x, y), arr || SEA); }
  hasTile(z, x, y) { return this.tiles.has(this.key(z, x, y)); }
  _px(z, gx, gy) {
    const k = z * 1e10 + (gx >> 8) * 1e5 + (gy >> 8);
    let a;
    if (k === this._k) a = this._a; else { a = this.tiles.get(k); if (a === undefined) return NaN; this._k = k; this._a = a; }
    return a[((gy & 255) << 8) | (gx & 255)];
  }
  sampleZ(lat, lon, z) {
    const fx = lonToPx(lon, z) - 0.5, fy = latToPx(lat, z) - 0.5;
    const x0 = Math.floor(fx), y0 = Math.floor(fy), tx = fx - x0, ty = fy - y0;
    const a = this._px(z, x0, y0), b = this._px(z, x0 + 1, y0), c = this._px(z, x0, y0 + 1), d = this._px(z, x0 + 1, y0 + 1);
    if (a !== a || b !== b || c !== c || d !== d) return NaN;
    return (a * (1 - tx) + b * tx) * (1 - ty) + (c * (1 - tx) + d * tx) * ty;
  }
  tierIndex(dist) { for (let i = 0; i < this.tiers.length; i++) if (dist <= this.tiers[i].maxDist) return i; return this.tiers.length - 1; }
  sampleTier(lat, lon, ti) {
    for (let i = ti; i < this.tiers.length; i++) { const v = this.sampleZ(lat, lon, this.tiers[i].z); if (v === v) return v; }
    return NaN;
  }
  sample(lat, lon, dist) { return this.sampleTier(lat, lon, this.tierIndex(dist || 0)); }
  /* 最も細かい層で読める標高(山頂や現在地の標高用) */
  sampleFinest(lat, lon) { return this.sampleTier(lat, lon, 0); }
}

/* ---------- 光線の歩進距離 ---------- */

    const lat = Math.asin(sp2) * R2D;

    try { await img.decode(); } catch (e) {
      busy(null);

    }

    URL.revokeObjectURL(url);
    stopLive(); stopGeo();
    let F, fSrc;
    if (exif && exif.f35) { F = C.focalPxFrom35mm(exif.f35, iw, ih); fSrc = `写真の情報(35mm換算 ${exif.f35}mm)`; }
    else { F = C.focalPxFrom35mm(26, iw, ih); fSrc = '不明のため iPhone標準カメラ相当(35mm換算 26mm)と仮定'; }

    let yaw0 = 0, yawKnown = false, yawSrc = '写真に方位の記録なし(全方位から探索)';
    if (exif && exif.dir != null) {
      yawKnown = true;
      yaw0 = exif.dirRef === 'M' ? exif.dir - decl : exif.dir;
      yawSrc = exif.dirRef === 'M' ? `写真の記録(磁北基準 → 真北へ ${fmtDeg(decl)} 補正)` : '写真の記録(真北基準)';
    }
    S.still = {
      src: 'photo', iw, ih, F, F0: F, fSrc, yaw0, pitch0: 0, roll: 0, adj: { yaw: 0, pitch: 0 }, yawKnown, pitchKnown: false, yawSrc,
      exif, manual: false, align: null, alignTried: false, name: file.name,
    };
    S.tap = null;
    show('still');
    busy(null);
    if (exif && exif.lat != null) {
      usePosition({ lat: exif.lat, lon: exif.lon, acc: exif.hErr || null, src: 'exif' });
    } else {

}
function askLocation() {
  openSheet(`
    <h2>撮影した場所を指定</h2>
    <p class="sub">この写真には位置情報が入っていません。iPhoneの写真を選ぶと位置情報が外されることがあります。今いる場所で撮った写真なら「現在地を使う」を押してください。</p>
    <div class="row" style="margin-top:12px"><button class="btn primary" id="useHere" type="button">現在地を使う</button></div>
    <label class="field">緯度, 経度

/* ---------- 写真・静止画のカメラ ---------- */
function stillCamera() {
  const st = S.still;
  return C.makeCamera({ yaw: st.yaw0 + st.adj.yaw, pitch: st.pitch0 + st.adj.pitch, roll: st.roll, F: st.F, cx: st.iw / 2, cy: st.ih / 2 });
}
function viewTransform(iw, ih, cover) {
  const W = overlay.clientWidth, H = overlay.clientHeight;
  const s = cover ? Math.max(W / iw, H / ih) : Math.min(W / iw, H / ih);
  // 根拠シートを開いているときは、写真をシートに隠れない側へ寄せる
  if (!cover && S.sheetOpen && W >= 760) {
    const aw = W - 472, s2 = Math.min(aw / iw, H / ih);
    return { s: s2, ox: (aw - iw * s2) / 2, oy: (H - ih * s2) / 2, W, H };
  }
  let oy = (H - ih * s) / 2;
  if (!cover && S.sheetOpen) oy = Math.min(oy, 88);
  return { s, ox: (W - iw * s) / 2, oy, W, H };
}
function drawStill() {
  // 画面いっぱいに収める(切り取らない)
  const st = S.still;
  const T = viewTransform(st.iw, st.ih, false);
  stillCv.style.cssText = `position:absolute;left:${T.ox}px;top:${T.oy}px;width:${st.iw * T.s}px;height:${st.ih * T.s}px`;
  return T;
}

/* ---------- 自動合わせ ---------- */
async function autoAlignStill(silent) {
  const st = S.still;
  if (!st) return;
  if (!S.ready) { if (!silent) toast('地形データの準備中です。完了すると自動で合わせます。'); return; }
  st.alignTried = true;
  busy(st.yawKnown ? '写真と稜線を照合中' : '写真と稜線を全方位で照合中');
  await nextFrame(); await nextFrame();
  const k = Math.min(1, 640 / Math.max(st.iw, st.ih));
  const w = Math.round(st.iw * k), h = Math.round(st.ih * k);
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const cx = cv.getContext('2d', { willReadFrequently: true });
  cx.drawImage(stillCv, 0, 0, w, h);
  const field = C.buildEdgeField(cx.getImageData(0, 0, w, h).data, w, h);
  const base = { yaw: st.yaw0 + st.adj.yaw, pitch: st.pitch0 + st.adj.pitch, roll: st.roll, F: st.F * k };
  const ranges = st.yawKnown ? { yaw: 20, pitch: st.pitchKnown ? 5 : 8 } : { yaw: 180, pitch: 8 };
  const res = C.autoAlign(S.pano, field, base, ranges);
  busy(null);
  const good = res && res.cover >= 0.45 && res.distinct >= 1.25;
  st.align = res ? Object.assign({}, res, { applied: good, at: Date.now() }) : { applied: false, failed: true };
  if (good) {
    st.adj.yaw += res.dyaw; st.adj.pitch += res.dpitch;
    // ライブ画面にも補正を引き継ぐ
    if (st.src === 'live') { S.liveOffset.yaw = st.liveOffset.yaw + st.adj.yaw; S.liveOffset.pitch = st.liveOffset.pitch + st.adj.pitch; }
    toast(`稜線を写真に合わせました(方位 ${fmtSigned(res.dyaw)}、上下 ${fmtSigned(res.dpitch)}、一致 ${Math.round(res.cover * 100)}%)`, 3500);
  } else {
    toast('写真の稜線をはっきり読み取れず、自動では合わせられませんでした。白い稜線を指でずらして、写真の山の形に重ねてください。', 7000);
  }
  renderChips();
  drawOverlay();
  if (S.tap) showResult();
}

/* ---------- 誤差の見積もり ---------- */
function uncertainty() {
  const st = S.still;
  let az, el, why;
  if (st && st.align && st.align.applied && !st.manualAfterAlign) { az = st.align.cover > 0.7 ? 0.25 : 0.4; el = az; why = `写真の稜線と自動で照合済み(一致 ${Math.round(st.align.cover * 100)}%)`; }
  else if (st && st.manual) { az = 0.4; el = 0.4; why = '稜線を手動で写真に合わせ済み'; }
  else if (st && st.src === 'live') { az = 6; el = st.pitchKnown ? 2 : 6; why = '方位センサーの値のみ(誤差が数度ある)'; }
  else if (st && st.yawKnown) { az = 5; el = 6; why = '写真に記録された方位のみ(誤差が数度ある)'; }
  else { az = 30; el = 8; why = '方位が不明'; }
  return { az, el, why, aligned: az < 1 };
}

/* ---------- 重ね表示 ---------- */
function resizeOverlay() {
  const dpr = Math.min(window.devicePixelRatio || 1, 3);
  const w = overlay.clientWidth, h = overlay.clientHeight;
  if (overlay.width !== Math.round(w * dpr) || overlay.height !== Math.round(h * dpr)) { overlay.width = Math.round(w * dpr); overlay.height = Math.round(h * dpr); }
  octx.setTransform(dpr, 0, 0, dpr, 0, 0);
  if (S.mode === 'still' && S.still) { drawStill(); drawOverlay(); }
}
function distColor(d, a) {
  // 近い尾根は暖色、遠い尾根ほど青白く(空気遠近法)
  const t = Math.max(0, Math.min(1, Math.log(Math.max(d, 500) / 500) / Math.log(240)));
  const r = Math.round(240 + (170 - 240) * t), g = Math.round(163 + (196 - 163) * t), b = Math.round(94 + (235 - 94) * t);
  return `rgba(${r},${g},${b},${a})`;
}
let lastDraw = null;
const MAX_LABELS = 8;     // 1画面に出す山名の上限
function drawOverlay() {
  const W = overlay.clientWidth, H = overlay.clientHeight;
  octx.clearRect(0, 0, W, H);
  let cam, T;
  if (S.mode === 'live') {
    const lc = liveCamera();
    if (!lc) return;
    cam = lc.cam; T = viewTransform(lc.iw, lc.ih, true);
  } else if (S.mode === 'still' && S.still) {
    cam = stillCamera(); T = viewTransform(S.still.iw, S.still.ih, false);
  } else return;
  lastDraw = { cam, T };
  const pano = S.pano;
  if (!pano) return;
  octx.save();
  if (S.mode === 'still') { octx.beginPath(); octx.rect(T.ox, 0, S.still.iw * T.s, H); octx.clip(); }
  drawOverlayInner(cam, T, W, H, pano);
  octx.restore();
}
function drawOverlayInner(cam, T, W, H, pano) {
  const toScr = p => ({ x: T.ox + p.x * T.s, y: T.oy + p.y * T.s });
  // 画面に入る方位の範囲
  const left = cam.unproject((0 - T.ox) / T.s, (H / 2 - T.oy) / T.s).az;
  const right = cam.unproject((W - T.ox) / T.s, (H / 2 - T.oy) / T.s).az;

    for (let c = 0; c < cnt; c++) {
      const i = (i0 + c) % pano.n, j = (i + 1) % pano.n;
      if (i >= pano.done) continue;
      for (let k = R.start[i]; k < R.start[i + 1]; k++) {
        const p = cam.project(i * pano.azStep, R.el[k]); if (!p) continue;
        const a = toScr(p);
        let best = -1, bd = 1e9;
        for (let m = R.start[j]; m < R.start[j + 1]; m++) {
          const rr = R.d[m] / R.d[k];
          if (rr < 0.88 || rr > 1.14) continue;
          const de = Math.abs(R.el[m] - R.el[k]);
          if (de < 0.3 * D2R && de < bd) { bd = de; best = m; }
        }
        octx.strokeStyle = distColor(R.d[k], 0.55);

    let placed = null;

        if (!boxes.some(b => box.x < b.x + b.w && box.x + box.w > b.x && box.y < b.y + b.h && box.y + box.h > b.y)) { placed = box; break; }

    if (!placed && !isSel && a.label) continue;   // 山名を置けない山は点も出さない
    const col = a.status === 'hidden' ? 'rgba(239,138,128,.85)' : a.status === 'marginal' ? 'rgba(233,196,106,.95)' : isSel ? '#f0a35e' : '#eef2f4';

    octx.fillStyle = isSel ? '#1a120b' : col;
    octx.textAlign = 'center';
    octx.font = '600 13px ' + getComputedStyle(document.body).fontFamily;
    octx.fillText(text, s.x, placed.y + 14);
    octx.font = '11px ui-monospace, Menlo, monospace';
    octx.fillStyle = isSel ? '#4a3220' : 'rgba(154,167,178,1)';
    octx.fillText(sub, s.x, placed.y + 26);
    octx.textAlign = 'start';
  }

  if (S.tap && S.mode === 'still') {
    {
      const s = toScr({ x: S.tap.ix, y: S.tap.iy });
      octx.strokeStyle = '#f0a35e'; octx.lineWidth = 2;
      octx.beginPath(); octx.arc(s.x, s.y, 14, 0, Math.PI * 2); octx.stroke();
      octx.beginPath(); octx.moveTo(s.x - 22, s.y); octx.lineTo(s.x - 8, s.y); octx.moveTo(s.x + 8, s.y); octx.lineTo(s.x + 22, s.y);
      octx.moveTo(s.x, s.y - 22); octx.lineTo(s.x, s.y - 8); octx.moveTo(s.x, s.y + 8); octx.lineTo(s.x, s.y + 22); octx.stroke();

}
function roundRect(x, y, w, h, r) {

function loop() {
  if (S.mode !== 'live') return;
  drawOverlay();
  const now = performance.now();
  if (!S.chipT || now - S.chipT > 400) { S.chipT = now; renderChips(); }
  requestAnimationFrame(loop);
}

/* ---------- 状態表示 ---------- */
function renderChips() {
  const el = $('#chips'); if (!el) return;
  const chips = [];
  const st = S.still;
  if (S.pos) {
    const src = S.pos.src === 'exif' ? '写真' : S.pos.src === 'manual' ? '入力' : 'GPS';
    chips.push(`<span class="chip${S.pos.acc > 100 ? ' warn' : ''}"><b>位置</b>${src}${S.pos.acc ? ` ±${Math.round(S.pos.acc)}m` : ''}</span>`);
  } else if (S.mode !== 'home') chips.push(`<span class="chip warn"><b>位置</b>取得中</span>`);
  if (S.mode === 'live') {
    chips.push(S.sensor.heading != null ? `<span class="chip"><b>方位</b><span class="num">${Math.round(C.normAz(S.sensor.heading + S.liveOffset.yaw))}°</span> ${dirName(C.normAz(S.sensor.heading + S.liveOffset.yaw))}</span>` : `<span class="chip warn"><b>方位</b>センサー待ち</span>`);
  } else if (st) {
    const yaw = C.normAz(st.yaw0 + st.adj.yaw);
    chips.push(`<span class="chip"><b>方位</b><span class="num">${Math.round(yaw)}°</span> ${dirName(yaw)}</span>`);
    const u = uncertainty();
    chips.push(`<span class="chip ${u.aligned ? 'good' : 'warn'}"><b>合わせ</b>${st.align && st.align.applied && !st.manualAfterAlign ? `自動 一致${Math.round(st.align.cover * 100)}%` : st.manual ? '手動' : '未'}</span>`);
  }
  if (S.progress) chips.push(`<span class="chip"><b>準備</b>${esc(S.progress)}</span>`);
  else if (S.ready) chips.push(`<span class="chip good"><b>山</b><span class="num">${S.analyzed.filter(a => a.label).length}</span>座が見える</span>`);
  el.innerHTML = chips.join('');
}

/* ---------- タップと判定結果 ---------- */
function handleTap(sx, sy) {
  if (S.mode === 'live') { if (!freeze()) return; }
  if (S.mode !== 'still' || !S.still) return;
  const st = S.still;
  const T = viewTransform(st.iw, st.ih, false);
  const ix = (sx - T.ox) / T.s, iy = (sy - T.oy) / T.s;
  if (ix < 0 || iy < 0 || ix > st.iw || iy > st.ih) return;
  const d = stillCamera().unproject(ix, iy);
  S.tap = { ix, iy, az: d.az, el: d.el };
  S.selected = null;
  drawOverlay();
  showResult();
}
function showResult(forcePeak) {

  if (!S.ready) {
    openSheet(`<h2>準備中です</h2><p class="sub">地形と山名のデータを準備しています(${esc(S.progress || '')})。完了すると自動で結果を表示します。</p>`);
    return;
  }
  const st = S.still, tap = S.tap;
  // タップは写真上の位置として保持し、合わせ直した後のカメラで方向を求め直す
  const dir = stillCamera().unproject(tap.ix, tap.iy);
  tap.az = dir.az; tap.el = dir.el;
  const T = viewTransform(st.iw, st.ih, false);
  const tapSigma = Math.atan(9 / (st.F * T.s)) * R2D;       // 指先のずれ(約9px)を角度に換算
  const u = uncertainty();
  const sAz = Math.hypot(u.az, tapSigma, 0.15), sEl = Math.hypot(u.el, tapSigma, 0.15);
  const elDeg = tap.el * R2D;
  const ranked = C.rankCandidates(S.cands, tap.az, elDeg, sAz, sEl);
  const j = C.judge(ranked);
  const terrain = C.terrainAt(S.dem, S.obs, S.pano.ctx, tap.az, tap.el, settings.maxDist);
  let chosen = forcePeak ? ranked.find(r => r.p.peak === forcePeak) : (j.top || null);
  S.selected = chosen ? chosen.p : null;
  drawOverlay();

  // 見えている地形の点に最も近い山頂
  let nearTerrain = null;
  if (terrain) {
    for (const a of S.cands) {
      const dd = C.distBearing(terrain.lat, terrain.lon, a.peak.lat, a.peak.lon).d;
      if (dd < 2500 && (!nearTerrain || dd < nearTerrain.dd)) nearTerrain = { a, dd };
    }
  }

  let head;
  const lvText = { high: '確度 高', mid: '確度 中', low: '確度 低', none: '該当なし' };
  if (forcePeak && chosen) {
    head = `<h2>${esc(chosen.p.peak.name)}</h2><p class="sub"><span class="level ${chosen === j.top ? j.level : 'low'}">${chosen === j.top ? lvText[j.level] : '別の候補'}</span>${peakLine(chosen.p)}</p>`;
  } else if (j.level !== 'none' && chosen) {
    const pre = j.level === 'high' ? '' : j.level === 'mid' ? 'おそらく ' : '候補: ';
    head = `<h2>${pre}${esc(chosen.p.peak.name)}</h2><p class="sub"><span class="level ${j.level}">${lvText[j.level]}</span>${peakLine(chosen.p)}</p>`;
  } else if (terrain && terrain.sky) {

  } else {

async function createMap(box) {

  map.fitBounds(L.latLngBounds(pts).pad(0.15));
}

/* ---------- シート ---------- */
function openSheet(html) {
  const el = $('#sheet');
  el.removeAttribute('data-n');
  $('#toast').hidden = true;
  el.innerHTML = `<div class="sheet-grip"><span class="bar"></span><button class="icon-btn" type="button" id="sheetClose" aria-label="閉じる">閉じる</button></div>` + html;
  el.hidden = false;
  el.scrollTop = 0;
  $('#sheetClose').onclick = closeSheet;
  if (!S.sheetOpen) { S.sheetOpen = true; if (S.mode === 'still') resizeOverlay(); }
}
function closeSheet() {
  const el = $('#sheet');
  el.hidden = true; el.innerHTML = '';
  if (mapInst) { mapInst.remove(); mapInst = null; }
  if (S.sheetOpen) { S.sheetOpen = false; if (S.mode === 'still') resizeOverlay(); }
}
function openSettings() {
  openSheet(`
    <h2>設定</h2>
    <label class="field">目の高さ(地面から、m)<input type="number" id="setEye" min="0" max="500" step="0.1" value="${settings.eye}">
      <small>マンションの上の階から見る場合は、その高さを入れてください(例: 5階なら約14m)。</small></label>
    <label class="field">調べる範囲<select id="setDist">
      ${[60000, 120000, 200000].map(v => `<option value="${v}" ${v === settings.maxDist ? 'selected' : ''}>${v / 1000} km 以内${v === 200000 ? '(読み込みに時間がかかる)' : ''}</option>`).join('')}</select></label>
    <label class="field">ライブ映像の画角(長辺、度)<input type="number" id="setFov" min="20" max="110" step="0.5" value="${settings.liveFov}">
      <small>山名が実際より外側・内側にずれて並ぶときに調整します。写真では2本指の広げ・縮めで調整できます。</small></label>
    <label class="field" style="grid-template-columns:auto 1fr;align-items:center"><input type="checkbox" id="setHidden" ${settings.showHidden ? 'checked' : ''}> 手前の地形に隠れた山も表示する</label>
    <div class="row"><button class="btn primary" id="setSave" type="button">保存</button></div>
    <p class="credit">標高: 国土地理院 標高タイル(取得できない場合は Terrain Tiles / AWS Open Data)。山名: © OpenStreetMap contributors。地図: 国土地理院。</p>`);
  $('#setSave').onclick = () => {
    const eye = parseFloat($('#setEye').value), dist = parseInt($('#setDist').value, 10), fov = parseFloat($('#setFov').value);
    if (eye >= 0 && eye <= 500) settings.eye = eye;
    if ([60000, 120000, 200000].includes(dist)) settings.maxDist = dist;
    if (fov >= 20 && fov <= 110) settings.liveFov = fov;
    settings.showHidden = $('#setHidden').checked;
    saveSettings();
    closeSheet();
    if (S.pos && needsReload(S.pos)) prepare(S.pos);
    drawOverlay();
  };
}

/* ---------- 操作(ドラッグ=合わせ、タップ=判定、2本指=画角) ---------- */
const pointers = new Map();
let gesture = null;
$('#stage').addEventListener('pointerdown', e => {
  if (e.target.closest('button')) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  $('#stage').setPointerCapture(e.pointerId);
  if (pointers.size === 1) gesture = { type: 'pan', x0: e.clientX, y0: e.clientY, lx: e.clientX, ly: e.clientY, t0: performance.now(), moved: false };
  else if (pointers.size === 2 && S.mode === 'still') {
    const [a, b] = [...pointers.values()];
    gesture = { type: 'pinch', d0: Math.hypot(a.x - b.x, a.y - b.y), F0: S.still.F, moved: true };
  }
});
$('#stage').addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId) || !gesture) return;
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (gesture.type === 'pan') {
    const dx = e.clientX - gesture.lx, dy = e.clientY - gesture.ly;
    if (Math.hypot(e.clientX - gesture.x0, e.clientY - gesture.y0) > 8) gesture.moved = true;
    if (!gesture.moved) return;
    gesture.lx = e.clientX; gesture.ly = e.clientY;
    if (S.mode === 'still' && S.still) {
      const st = S.still, T = viewTransform(st.iw, st.ih, false);
      st.adj.yaw -= Math.atan(dx / (st.F * T.s)) * R2D;
      st.adj.pitch += Math.atan(dy / (st.F * T.s)) * R2D;
      st.manual = true; if (st.align && st.align.applied) st.manualAfterAlign = true;
      if (st.src === 'live') { S.liveOffset.yaw = st.liveOffset.yaw + st.adj.yaw; S.liveOffset.pitch = st.liveOffset.pitch + st.adj.pitch; }
      drawOverlay();
    } else if (S.mode === 'live') {
      const lc = liveCamera(); if (!lc) return;
      const T = viewTransform(lc.iw, lc.ih, true);
      S.liveOffset.yaw -= Math.atan(dx / (lc.cam.F * T.s)) * R2D;
      S.liveOffset.pitch += Math.atan(dy / (lc.cam.F * T.s)) * R2D;
    }
  } else if (gesture.type === 'pinch' && pointers.size === 2) {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    S.still.F = Math.max(S.still.F0 * 0.6, Math.min(S.still.F0 * 1.6, gesture.F0 * d / gesture.d0));
    S.still.manual = true;
    drawOverlay();
  }
});
const endPointer = e => {
  if (!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);
  if (gesture && gesture.type === 'pan' && !gesture.moved && performance.now() - gesture.t0 < 600 && e.type === 'pointerup') handleTap(e.clientX, e.clientY);
  if (gesture && gesture.type === 'pan' && gesture.moved) { renderChips(); if (S.tap && S.mode === 'still') showResult(); }
  if (gesture && gesture.type === 'pinch' && pointers.size < 2) { renderChips(); if (S.tap) showResult(); }
  if (!pointers.size) gesture = null;
};
$('#stage').addEventListener('pointerup', endPointer);
$('#stage').addEventListener('pointercancel', endPointer);

/* ---------- ボタン ---------- */
$('#btnLive').onclick = () => startLive();
$('#btnPhoto').onclick = () => $('#fileInput').click();
$('#btnPhoto2').onclick = () => $('#fileInput').click();
$('#fileInput').onchange = e => { const f = e.target.files && e.target.files[0]; e.target.value = ''; if (f) loadPhoto(f); };
$('#btnShutter').onclick = () => { if (freeze()) toast('山をタップすると名前と根拠を表示します。'); };
$('#btnAlign').onclick = () => { if (S.still) { S.still.manualAfterAlign = false; autoAlignStill(false); } };
$('#btnReset').onclick = () => {
  const st = S.still; if (!st) return;
  st.adj = { yaw: 0, pitch: 0 }; st.F = st.F0; st.manual = false; st.align = null; st.manualAfterAlign = false;
  if (st.src === 'live') S.liveOffset = { ...st.liveOffset };
  drawOverlay(); renderChips(); if (S.tap) showResult();
};
$('#btnBack').onclick = () => {
  if (S.mode === 'still' && S.still && S.still.src === 'live' && S.stream) { backToLive(); loop(); return; }
  stopLive(); stopGeo(); S.still = null; S.tap = null; show('home');
};
$('#btnSettings').onclick = openSettings;
$('#btnMap').onclick = () => openMapView();
$('#btnSettingsHome').onclick = openSettings;
window.addEventListener('resize', () => { resizeOverlay(); });
if (!window.isSecureContext) $('#secureBanner').hidden = false;

// 検証用の窓口(画面からは使わない)
window.__yama = { S, settings, prepare, handleTap, showResult, autoAlignStill, drawOverlay,
  imgToScreen: (x, y) => { const st = S.still, T = viewTransform(st.iw, st.ih, false); return [T.ox + x * T.s, T.oy + y * T.s]; } };
show('home');
})();
</script>
